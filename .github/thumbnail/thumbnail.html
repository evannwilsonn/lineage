<style>

:root {

  --red: #cc3340; --red-l: #e5585f; --red-d: #9a1f2a;

  --button: #f4f1e4; --button-hi: #ffffff; --button-lo: #d9d4bf;
}
html, body { margin: 0; }
body {
  width: 1200px; height: 627px; overflow: hidden; position: relative; color: #edf0e6;
  font-family: "Instrument Sans", sans-serif;
  background:
    radial-gradient(ellipse 520px 360px at 860px 300px, rgba(255, 246, 214, .2), transparent 70%),
    radial-gradient(ellipse 900px 640px at 600px 300px, #1d4a35 0 40%, #133826 70%, #0a2117 100%);

body::before { /* felt nap */

}
.chalk { position: absolute; inset: 0; }

.left { position: absolute; left: 70px; top: 92px; width: 460px; }
.kicker { font: 700 14px/1 "Instrument Sans"; letter-spacing: .22em; text-transform: uppercase; color: #c3d6c9; }
h1 { font: 400 124px/.9 "Gloock", serif; margin: 20px 0 18px; letter-spacing: -.01em; }

.sub b { color: #fff; }
.armband {
  position: absolute; left: 74px; bottom: 54px; width: 150px; padding: 10px 14px 9px; background: #fbfbf6; color: #16231c;
  border-radius: 3px; transform: rotate(-4deg); box-shadow: 0 12px 20px -8px rgba(0, 0, 0, .55); text-align: center;
}
.armband::before { content: ""; position: absolute; top: -8px; left: 24px; width: 100px; height: 13px; border: 1.8px solid #9aa39d; border-bottom: none; border-radius: 7px 7px 0 0; }
.a-top { display: flex; justify-content: space-between; font: 700 11px/1 "Instrument Sans"; letter-spacing: .16em; border-bottom: 1px solid #16231c; padding-bottom: 6px; }
.a-no { display: block; font: 700 64px/.95 "Big Shoulders"; margin-top: 4px; }
.a-bot { display: block; font: 700 10px/1.1 "Instrument Sans"; letter-spacing: .16em; border-top: 1px solid #16231c; padding-top: 6px; margin-top: 3px; }

.swift b { color: #fff; font-size: 17px; }
.rosette { position: absolute; filter: drop-shadow(0 12px 12px rgba(0, 0, 0, .45)) drop-shadow(0 0 18px rgba(255, 236, 170, .12)); }
.rosette svg { width: 100%; height: auto; display: block; overflow: visible; }
.rosette--1 { --base: var(--blue); --light: var(--blue-l); --dark: var(--blue-d); --edge: #f1e7c2; --tail-ink: #fbfaf2; --stitch: rgba(255,255,255,.7); }
.rosette--2 { --base: var(--red); --light: var(--red-l); --dark: var(--red-d); --edge: #f1e7c2; --tail-ink: #fffaf3; --stitch: rgba(255,255,255,.7); }
.rosette--3 { --base: var(--gold); --light: var(--gold-l); --dark: var(--gold-d); --edge: #fbf6e2; --tail-ink: #2e2405; --stitch: rgba(60,45,0,.5); }
.rosette-place { font-family: "Gloock", serif; fill: var(--dark); }
.rosette-arc { font: 700 7.2px "Instrument Sans"; letter-spacing: 2.1px; fill: var(--dark); }
.rosette-breed { font-family: "Gloock", serif; fill: var(--tail-ink); }
.rosette-prob { font-family: "Big Shoulders"; font-weight: 700; fill: var(--tail-ink); }
.rosette-small { font: 700 7.4px "Instrument Sans"; letter-spacing: 1.6px; fill: var(--tail-ink); opacity: .85; }
.pin { fill: #c9b26a; stroke: #8f7a36; stroke-width: .8; }
#r2 { left: 540px; top: 118px; width: 205px; transform: rotate(-7deg); }
#r3 { left: 1000px; top: 132px; width: 190px; transform: rotate(7deg); }

</style>
